services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: skyroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-skyroute}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-skyroute_secret}
      POSTGRES_DB: ${DB_NAME:-skyroute_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - skyroute_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-skyroute} -d ${DB_NAME:-skyroute_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: skyroute-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - skyroute_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  skyroute_postgres_data:
  skyroute_redis_data:
